services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: audio_editor
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: audio_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio -d audio_editor"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
