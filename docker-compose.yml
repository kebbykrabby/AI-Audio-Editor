# Dev-only stack. All credentials below are local placeholders — never used in prod.
# Real prod deployments use environment overrides or a secrets manager, not this file.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: audio_editor
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: audio_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio -d audio_editor"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9011:9001"   # console UI (host 9011 — 9001 reserved by WinNAT on Windows)
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket creation; exits after mc completes.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio_dev minio_dev_secret &&
      mc mb --ignore-existing local/audio-editor &&
      mc mb --ignore-existing local/audio-editor-test &&
      echo 'MinIO buckets ready: audio-editor, audio-editor-test'
      "
    restart: "no"

volumes:
  pgdata:
  minio_data:
